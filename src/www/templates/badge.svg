<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="350" height="70" viewBox="0 0 350 70">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main background -->
  <rect width="350" height="70" fill="url(#grad1)" rx="8" filter="url(#shadow)"/>
  
  <!-- User name section -->
  <rect width="200" height="70" fill="rgba(0,0,0,0.2)" rx="8"/>
  <text x="15" y="28" font-size="14" fill="white" font-weight="bold" font-family="Arial, sans-serif">
    {{ user.name }}
  </text>
  <text x="15" y="50" font-size="11" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif">
    OSM Streak Profile
  </text>
  
  <!-- Stats section -->
  <g font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">
    <!-- Score -->
    <rect x="220" y="10" width="55" height="25" fill="rgba(255,255,255,0.15)" rx="4"/>
    <text x="247" y="20" text-anchor="middle" font-size="14">{{ user.score }}</text>
    <text x="247" y="30" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Score</text>
    
    <!-- Level -->
    <rect x="285" y="10" width="55" height="25" fill="rgba(255,255,255,0.15)" rx="4"/>
    <text x="312" y="20" text-anchor="middle" font-size="14">{{ user.level }}</text>
    <text x="312" y="30" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.9)">Level</text>
    
    <!-- Streak -->
    <rect x="220" y="40" width="120" height="20" fill="rgba(255,255,255,0.15)" rx="4"/>
    <text x="280" y="53" text-anchor="middle" font-size="11">🔥 {{ user.streak }} days streak</text>
  </g>
  
  <!-- Border -->
  <rect width="350" height="70" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1" rx="8"/>
</svg>
